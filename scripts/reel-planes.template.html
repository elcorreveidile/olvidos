<meta charset="utf-8" />
<title>Clip Planes Olvidos</title>
<!--
  Clip "Hazte socio · 3 planes" (post 08). Datos REALES tomados de
  src/app/hazte-socio/page.tsx (precios, nombres y beneficios). Carrusel de las
  tres tarjetas (Estándar 50€, Mecenas 120€ destacado, Institucional 250€) y
  cierre a olvidos.es/hazte-socio. Sin capturas: composición determinista.
    RAW_DIR=footage-reel/noassets TEMPLATE=scripts/reel-planes.template.html \
    OUT=footage-reel/clip-planes.mp4 PORTADA=footage-reel/portada-planes.png \
    PORTADA_T=5.4 QP=26 node scripts/reel-clip-build.mjs
-->
<style>
  /* __FONT_CSS__ */
  :root{
    --coral:#ff6261; --coral-dark:#e85555; --tinta:#141414;
    --teatro:#7a1420; --teatro-light:#9b1c2c; --teatro-dark:#560d16;
    --paper:#ffffff; --paper-warm:#f6f1ea; --line:#e7ddd2; --acero:#617685;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  #stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"LibreFranklin",system-ui,sans-serif;}
  .bg{position:absolute;inset:0;}
  #bgPaper{background:radial-gradient(120% 80% at 50% 0%,#fff 0%,var(--paper-warm) 100%);}
  #bgVelvet{background:radial-gradient(120% 90% at 50% 30%,var(--teatro-light) 0%,var(--teatro) 42%,var(--teatro-dark) 100%);opacity:0;}

  #phone{position:absolute;left:196px;top:243px;width:688px;height:1433px;border-radius:62px;
    background:#0a0a0a;box-shadow:0 30px 90px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.35);padding:22px;}
  #screen{position:absolute;left:24px;top:24px;width:640px;height:1385px;border-radius:42px;overflow:hidden;
    background:radial-gradient(120% 55% at 50% 0%,#fff 0%,var(--paper-warm) 100%);}
  #notch{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:150px;height:30px;background:#0a0a0a;border-radius:16px;z-index:8;}
  #apphead{position:absolute;left:0;right:0;top:92px;text-align:center;z-index:2;}
  #apphead .k{font-weight:800;font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--coral);}
  #apphead .h{margin-top:8px;font-weight:900;font-size:44px;color:var(--tinta);}
  #apphead .h b{color:var(--coral);}

  /* Carrusel de tarjetas */
  #deck{position:absolute;left:40px;top:262px;width:560px;height:812px;z-index:3;}
  .plan{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:20px;
    box-shadow:0 22px 50px rgba(20,4,8,.12);padding:34px 34px 30px;display:flex;flex-direction:column;will-change:transform,opacity;opacity:0;}
  .plan.hot{border:2px solid var(--coral);box-shadow:0 26px 60px rgba(255,98,97,.22);}
  .badge{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;
    font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:7px 18px;border-radius:999px;}
  .pname{font-weight:900;font-size:44px;color:var(--tinta);letter-spacing:-.5px;}
  .pnote{margin-top:4px;font-family:"CrimsonText",Georgia,serif;font-size:24px;color:var(--acero);}
  .price{margin-top:14px;display:flex;align-items:baseline;gap:8px;}
  .price .n{font-weight:900;font-size:72px;color:var(--coral);line-height:1;}
  .price .u{font-weight:700;font-size:26px;color:var(--tinta);opacity:.6;}
  .hr{height:1px;background:var(--line);margin:20px 0 18px;}
  .benes{display:flex;flex-direction:column;gap:15px;}
  .bene{display:flex;gap:14px;align-items:flex-start;}
  .bene .c{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:rgba(255,98,97,.12);color:var(--coral);
    font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .bene .t{font-size:26px;line-height:1.28;color:#241f1c;}

  /* Puntos de progreso */
  #dots{position:absolute;left:0;right:0;top:1120px;display:flex;justify-content:center;gap:14px;z-index:4;}
  #dots span{width:16px;height:16px;border-radius:50%;background:rgba(20,20,20,.16);transition:none;}

  /* Cierre */
  #close{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;}
  #close .mark{font-weight:900;font-size:180px;line-height:.8;color:#fff;letter-spacing:-6px;}
  #close .mark b{color:var(--coral);}
  #close .cta2{margin-top:24px;font-weight:900;font-size:56px;color:#fff;}
  #close .dom{margin-top:14px;font-weight:700;font-size:38px;color:rgba(255,255,255,.9);}
  #close .cta{margin-top:40px;font-weight:800;font-size:34px;color:var(--teatro-dark);background:#fff;padding:19px 44px;border-radius:8px;}
  #close .sub{margin-top:32px;font-family:"CrimsonText",Georgia,serif;font-style:italic;font-size:33px;color:rgba(255,255,255,.85);}
  #vignette{position:absolute;inset:0;z-index:35;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.26);}
</style>

<div id="stage">
  <div class="bg" id="bgPaper"></div>
  <div class="bg" id="bgVelvet"></div>
  <div id="phone">
    <div id="screen">
      <div id="notch"></div>
      <div id="apphead"><div class="k">Hazte socio</div><div class="h"><b>[</b>Tres formas de sumarte</div></div>
      <div id="deck"></div>
      <div id="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div id="close">
    <div class="mark">[<b>o</b></div>
    <div class="cta2">Hazte socio</div>
    <div class="dom">olvidos.es/hazte-socio</div>
    <div class="cta">Pago seguro con Stripe</div>
    <div class="sub">Tu apoyo sostiene la revista, desde 1981</div>
  </div>
  <div id="vignette"></div>
</div>

<script>
window.__ASSETS__ = window.__ASSETS__ || null; /* __ASSETS_INJECT__ */
(function(){
  const PLANES = [
    { nombre:"Estándar", precio:"50", nota:"Socio individual", hot:false, benes:[
      "Carné digital de socio con QR",
      "Voz y voto en la Asamblea",
      "Invitación a los encuentros, con asiento reservado",
      "La edición del año de la revista, en digital",
      "El libro y la revista impresa a precio de socio",
    ]},
    { nombre:"Mecenas", precio:"120", nota:"Individual · mayor apoyo", hot:true, benes:[
      "Todo lo del plan Estándar",
      "La revista impresa del año, en tu casa",
      "Ejemplar del libro de las editoriales de Mariano",
      "Tu nombre en los créditos de la revista impresa",
      "Mención como Mecenas en la web",
    ]},
    { nombre:"Institucional", precio:"250", nota:"Entidades, bibliotecas y empresas", hot:false, benes:[
      "Membresía a nombre de la entidad",
      "5 ejemplares de cada edición impresa (revista y libro)",
      "Logotipo destacado en la web",
      "Factura y convenio de colaboración",
      "Voz y voto en la Asamblea, por representante",
    ]},
  ];
  const deck=document.getElementById("deck");
  const cards=PLANES.map((p)=>{
    const el=document.createElement("div");
    el.className="plan"+(p.hot?" hot":"");
    el.innerHTML =
      (p.hot?'<div class="badge">El más elegido</div>':'')+
      '<div class="pname">'+p.nombre+'</div>'+
      '<div class="pnote">'+p.nota+'</div>'+
      '<div class="price"><span class="n">'+p.precio+'€</span><span class="u">/año</span></div>'+
      '<div class="hr"></div>'+
      '<div class="benes">'+p.benes.map((b)=>'<div class="bene"><div class="c">✓</div><div class="t">'+b+'</div></div>').join('')+'</div>';
    deck.appendChild(el);
    return el;
  });
  const dots=[...document.querySelectorAll("#dots span")];

  const el=(id)=>document.getElementById(id);
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeOut=(t)=>1-Math.pow(1-t,3);

  // ventanas de cada tarjeta
  const W=[[0,4200],[4200,8600],[8600,12400]];
  const TLclose=[12200,15400];
  window.__DURATION_MS__=15400;

  window.renderAt=function(t){
    el("bgVelvet").style.opacity=clamp((t-TLclose[0])/600,0,1).toFixed(3);

    const phone=el("phone");
    const closeP=clamp((t-TLclose[0])/700,0,1);
    const introS=easeOut(clamp(t/1000,0,1));
    phone.style.opacity=(1-closeP).toFixed(3);
    phone.style.transform=`scale(${(lerp(0.965,1,introS)*(1-0.06*closeP)).toFixed(4)})`;
    phone.style.transformOrigin="50% 46%";

    let active=0;
    cards.forEach((c,i)=>{
      const [a,b]=W[i];
      const enterP=easeOut(clamp((t-a)/480,0,1));
      const exitP=clamp((t-(b-360))/360,0,1);
      const op=enterP*(1-exitP);
      const x=lerp(80,0,enterP) - exitP*80;
      c.style.opacity=op.toFixed(3);
      c.style.transform=`translateX(${x.toFixed(1)}px)`;
      if(t>=a && t<b) active=i;
    });
    dots.forEach((d,i)=>{ d.style.background = i===active && t<TLclose[0] ? "var(--coral)" : "rgba(20,20,20,.16)"; d.style.transform = i===active? "scale(1.15)":"scale(1)"; });

    el("close").style.opacity=clamp((t-(TLclose[0]+150))/650,0,1).toFixed(3);
  };
  window.__READY__=true;
})();
</script>
