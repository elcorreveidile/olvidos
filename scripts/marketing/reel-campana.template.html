<meta charset="utf-8" />
<title>Reel campaña Olvidos</title>
<!--
  Reel-montaje 9:16 (1080x1920) de la campaña: encadena los 4 frames de la story
  (rojo/coral/tinta/acero) con fundidos cruzados y un ligero zoom Ken Burns.
  ~12 s para caber en la pista de Reel8 (extraída del clip de Granada 2031).
    RAW_DIR=footage-reel/raw-campana TEMPLATE=scripts/reel-campana.template.html \
    OUT=footage-reel/reel-campana-silent.mp4 PORTADA=footage-reel/portada-campana.png \
    PORTADA_T=0.3 QP=25 node scripts/reel-clip-build.mjs
  Audio:
    node scripts/reel-add-audio.mjs footage-reel/clip-g2031.mp4 \
      footage-reel/reel-campana.mp4 --video footage-reel/reel-campana-silent.mp4 \
      --fadein 0.4 --fadeout 1.0
-->
<style>
  /* __FONT_CSS__ */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  #stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:#000;}
  .frame{position:absolute;inset:0;opacity:0;will-change:opacity,transform;}
  .frame img{position:absolute;top:50%;left:50%;width:1080px;height:1920px;object-fit:cover;transform:translate(-50%,-50%) scale(1.05);transform-origin:50% 50%;}
  #grain{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,.22);}
</style>

<div id="stage">
  <div class="frame" data-k="story-01.png"><img /></div>
  <div class="frame" data-k="story-02.png"><img /></div>
  <div class="frame" data-k="story-03.png"><img /></div>
  <div class="frame" data-k="story-04.png"><img /></div>
  <div id="grain"></div>
</div>

<script>
window.__ASSETS__ = window.__ASSETS__ || null; /* __ASSETS_INJECT__ */
(function(){
  const A = window.__ASSETS__;
  const frames = Array.from(document.querySelectorAll(".frame"));
  frames.forEach((f)=>{ const a=A[f.dataset.k]; f.querySelector("img").src=a.src; });
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=(t)=>t<=0?0:t>=1?1:t*t*(3-2*t);
  const N=4, SPACING=3000, LIFE=3600, FADE=600;   // ms
  window.__DURATION_MS__ = (N-1)*SPACING + SPACING; // 12000
  window.renderAt=function(t){
    for(let i=0;i<N;i++){
      const start=i*SPACING;
      const finEnd=start+FADE;
      const foutStart=start+SPACING;      // empieza a irse cuando entra el siguiente
      const foutEnd=start+SPACING+FADE;
      let op;
      if(t<start) op=0;
      else if(t<finEnd) op=smooth((t-start)/FADE);
      else if(i===N-1) op=1;              // el último se mantiene
      else if(t<foutStart) op=1;
      else if(t<foutEnd) op=1-smooth((t-foutStart)/FADE);
      else op=0;
      const f=frames[i];
      f.style.opacity=op.toFixed(3);
      const p=clamp((t-start)/LIFE,0,1);
      const scale=lerp(1.05,1.115,p);
      f.querySelector("img").style.transform=`translate(-50%,-50%) scale(${scale.toFixed(4)})`;
    }
  };
  window.__READY__=true;
})();
</script>
