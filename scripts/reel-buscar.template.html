<meta charset="utf-8" />
<title>Clip Buscador Olvidos</title>
<!--
  Clip "El buscador" (post 05). Escena A: barra de búsqueda tecleando "Egea"
  (compuesta, estilo del sitio). Escena B: resultados REALES capturados de
  olvidos.es/buscar?q=Egea (41 resultados, artículos reales). Reel7 (pulso).
    RAW_DIR=footage-reel/raw-buscar TEMPLATE=scripts/reel-buscar.template.html \
    OUT=footage-reel/clip-buscar.mp4 PORTADA=footage-reel/portada-buscar.png \
    PORTADA_T=2.2 QP=26 node scripts/reel-clip-build.mjs
-->
<style>
  /* __FONT_CSS__ */
  :root{--coral:#ff6261;--coral-dark:#e85555;--tinta:#141414;--teatro:#7a1420;--teatro-light:#9b1c2c;--teatro-dark:#560d16;--paper:#fff;--paper-warm:#f6f1ea;--line:#e2d9cf;--acero:#617685;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  #stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"LibreFranklin",system-ui,sans-serif;}
  .bg{position:absolute;inset:0;}
  #bgPaper{background:radial-gradient(120% 80% at 50% 0%,#fff 0%,var(--paper-warm) 100%);}
  #bgVelvet{background:radial-gradient(120% 90% at 50% 30%,var(--teatro-light) 0%,var(--teatro) 42%,var(--teatro-dark) 100%);opacity:0;}
  #phone{position:absolute;left:196px;top:243px;width:688px;height:1433px;border-radius:62px;background:#0a0a0a;box-shadow:0 30px 90px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.35);padding:22px;}
  #screen{position:absolute;left:24px;top:24px;width:640px;height:1385px;border-radius:42px;overflow:hidden;background:radial-gradient(120% 55% at 50% 0%,#fff 0%,var(--paper-warm) 100%);}
  #notch{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:150px;height:30px;background:#0a0a0a;border-radius:16px;z-index:9;}

  /* Escena A: buscador */
  #searchScene{position:absolute;inset:0;z-index:3;}
  #sHead{position:absolute;left:0;right:0;top:150px;text-align:center;}
  #sHead .k{font-weight:800;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:var(--coral);}
  #sHead .h{margin-top:12px;font-weight:900;font-size:88px;color:var(--tinta);letter-spacing:-1px;}
  #sHead .h b{color:var(--coral);}
  #sHead .s{margin-top:14px;font-family:"CrimsonText",Georgia,serif;font-size:26px;color:rgba(20,20,20,.55);}
  #sbar{position:absolute;left:40px;right:40px;top:560px;display:flex;gap:14px;}
  #sinput{flex:1;background:#fff;border:2px solid var(--line);border-radius:8px;height:96px;display:flex;align-items:center;padding:0 26px;font-size:38px;color:var(--tinta);box-shadow:0 6px 18px rgba(20,4,8,.06);}
  #sinput .cur{display:inline-block;width:3px;height:44px;background:var(--coral);margin-left:3px;}
  #sbtn{flex:0 0 auto;background:var(--coral);color:#fff;font-weight:800;font-size:34px;border-radius:8px;padding:0 34px;display:flex;align-items:center;}
  #shint{position:absolute;left:40px;right:40px;top:700px;font-size:26px;color:var(--acero);}
  #shint b{color:var(--tinta);font-weight:700;}

  /* Escena B: resultados reales */
  #results{position:absolute;inset:0;z-index:4;opacity:0;overflow:hidden;}
  #rshot{position:absolute;top:0;left:0;width:640px;height:auto;will-change:transform;transform:translateY(0);}

  #scrim{position:absolute;left:24px;right:24px;bottom:24px;height:420px;border-radius:0 0 42px 42px;background:linear-gradient(to bottom,rgba(20,4,8,0) 0%,rgba(60,10,18,.5) 52%,rgba(40,7,12,.92) 100%);z-index:6;opacity:0;}
  #rotulo{position:absolute;left:110px;right:110px;top:1292px;z-index:30;text-align:center;opacity:0;}
  #rotulo .kick{font-weight:800;font-size:26px;letter-spacing:6px;text-transform:uppercase;color:var(--coral);}
  #rotulo .line{margin-top:12px;font-weight:800;font-size:48px;line-height:1.12;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5);}
  #rotulo.dark .line{color:var(--tinta);text-shadow:none;}

  #close{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;}
  #close .mark{font-weight:900;font-size:190px;line-height:.8;color:#fff;letter-spacing:-6px;}
  #close .mark b{color:var(--coral);}
  #close .cta2{margin-top:24px;font-weight:900;font-size:52px;color:#fff;}
  #close .dom{margin-top:14px;font-weight:700;font-size:38px;color:rgba(255,255,255,.9);}
  #close .cta{margin-top:42px;font-weight:800;font-size:34px;color:var(--teatro-dark);background:#fff;padding:19px 44px;border-radius:8px;}
  #close .sub{margin-top:34px;font-family:"CrimsonText",Georgia,serif;font-style:italic;font-size:33px;color:rgba(255,255,255,.85);}
  #vignette{position:absolute;inset:0;z-index:35;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.26);}
</style>

<div id="stage">
  <div class="bg" id="bgPaper"></div>
  <div class="bg" id="bgVelvet"></div>
  <div id="phone">
    <div id="screen">
      <div id="searchScene">
        <div id="sHead"><div class="k">Búsqueda</div><div class="h"><b>[</b>buscar</div><div class="s">Artículos, autores y actividades</div></div>
        <div id="sbar">
          <div id="sinput"><span id="stext"></span><span class="cur" id="scur"></span></div>
          <div id="sbtn">Buscar</div>
        </div>
        <div id="shint">Prueba: <b>Egea</b>, <b>Lorca</b>, <b>Granada</b>…</div>
      </div>
      <div id="results"><img id="rshot" /></div>
      <div id="notch"></div>
      <div id="scrim"></div>
    </div>
  </div>
  <div id="rotulo"><div class="kick"></div><div class="line"></div></div>
  <div id="close">
    <div class="mark">[<b>o</b></div>
    <div class="cta2">Búscalo</div>
    <div class="dom">olvidos.es/buscar</div>
    <div class="cta">Escríbelo y encuéntralo</div>
    <div class="sub">Todo Olvidos, a un clic</div>
  </div>
  <div id="vignette"></div>
</div>

<script>
window.__ASSETS__ = window.__ASSETS__ || null; /* __ASSETS_INJECT__ */
(function(){
  const A=window.__ASSETS__; const el=(id)=>document.getElementById(id);
  const asset=A["buscar-full.png"]; el("rshot").src=asset.src;
  const SCREEN_W=640,SCREEN_H=1385,IMG_W=780;
  const scale=SCREEN_W/IMG_W, cssToScreen=2*scale, dispH=asset.h*scale, maxCss=(dispH-SCREEN_H)/cssToScreen;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
  const easeInOut=(t)=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const easeOut=(t)=>1-Math.pow(1-t,3);
  const win=(t,a,b,c,d)=>clamp(t<b?(t-a)/(b-a):t<c?1:1-(t-c)/(d-c),0,1);
  const panCss=(y)=>-(y*cssToScreen);

  const QUERY="Egea";
  const TYPE=[900,2100];          // ventana de tecleo
  const TL={search:[0,4200],reveal:[4000,4700],results:[4700,9600],close:[9400,12200]};
  window.__DURATION_MS__=12200;
  const rot=el("rotulo"),rk=rot.querySelector(".kick"),rl=rot.querySelector(".line");

  window.renderAt=function(t){
    el("bgVelvet").style.opacity=clamp((t-TL.close[0])/600,0,1).toFixed(3);
    const phone=el("phone"); const closeP=clamp((t-TL.close[0])/700,0,1);
    phone.style.opacity=(1-closeP).toFixed(3);
    phone.style.transform=`scale(${(lerp(0.965,1,easeOut(clamp(t/1100,0,1)))*(1-0.06*closeP)).toFixed(4)})`;
    phone.style.transformOrigin="50% 46%";

    // --- tecleo ---
    const tp=clamp((t-TYPE[0])/(TYPE[1]-TYPE[0]),0,1);
    const nch=Math.round(tp*QUERY.length);
    el("stext").textContent=QUERY.slice(0,nch);
    // cursor parpadea mientras se escribe / al terminar
    el("scur").style.opacity = (t<TL.reveal[0] && (Math.floor(t/550)%2===0 || tp<1)) ? "1":"0";

    // --- escena buscador vs resultados ---
    const searchOp=1-clamp((t-TL.reveal[0])/(TL.reveal[1]-TL.reveal[0]),0,1);
    el("searchScene").style.opacity=searchOp.toFixed(3);
    const resOp=clamp((t-TL.reveal[0])/(TL.reveal[1]-TL.reveal[0]),0,1);
    el("results").style.opacity=resOp.toFixed(3);

    // --- paneo de resultados ---
    let y=250;
    const p=easeInOut(clamp((t-TL.results[0])/(TL.results[1]-TL.results[0]),0,1));
    y=lerp(230,1230,p); y=clamp(y,0,maxCss);
    el("rshot").style.transform=`translateY(${panCss(y).toFixed(1)}px)`;

    // --- rótulo ---
    let kick="",line="",op=0,dark=false,scrimOp=0;
    if(t<TL.reveal[0]){ kick="El buscador"; line="Escribe lo que buscas"; dark=true;
      op=win(t,600,1200,TL.reveal[0]-500,TL.reveal[0]-50); }
    else if(t>=TL.reveal[0] && t<TL.close[0]){ kick="41 resultados"; line="Artículos, autores y más";
      op=win(t,TL.reveal[1]+300,TL.reveal[1]+900,TL.close[0]-600,TL.close[0]-100); scrimOp=op; }
    el("scrim").style.opacity=(scrimOp*0.98).toFixed(3);
    rot.classList.toggle("dark",dark);
    rk.textContent=kick; rl.textContent=line; rot.style.opacity=op.toFixed(3);

    el("close").style.opacity=clamp((t-(TL.close[0]+150))/650,0,1).toFixed(3);
  };
  window.__READY__=true;
})();
</script>
