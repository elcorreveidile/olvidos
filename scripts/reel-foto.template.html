<meta charset="utf-8" />
<title>Reel Foto — Olvidos</title>
<!--
  Motor de reel a partir de FOTOS (obra + ambiente). Cada foto se pinta a sangre
  en 1080x1920: fondo = la propia imagen en cover, desenfocada y oscurecida;
  primer plano = la imagen completa (contain) con Ken-Burns (zoom lento). Encima,
  rótulos de marca (kicker + título) o ficha de obra (título + técnica/año), y
  tarjetas de texto sobre velvet para gancho/cierre.
  Inyectado por reel-foto-build.mjs:
    window.__ASSETS__  (fichero.jpg -> {src,w,h})
    window.__SCENES__  (array de escenas)
    window.__META__    (textos fijos, tiempos)
  Escena: { img?, kind:'art'|'photo'|'card', dur, kicker?, title?, sub?,
            obra?:{titulo,meta}, zoom?:[from,to], pan?:[dx,dy] }
-->
<style>
  /* __FONT_CSS__ */
  :root{
    --coral:#ff6261;--tinta:#141414;--teatro:#7a1420;--teatro-light:#9b1c2c;--teatro-dark:#3f0910;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  #stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;
    font-family:"LibreFranklin",system-ui,sans-serif;background:#0a0a0a;}

  .scene{position:absolute;inset:0;opacity:0;}
  .bg{position:absolute;inset:-8%;background-size:cover;background-position:center;
    filter:blur(28px) brightness(.42) saturate(1.05);transform:scale(1.1);}
  .fg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .fg img{max-width:100%;max-height:100%;object-fit:contain;
    box-shadow:0 40px 120px rgba(0,0,0,.6),0 8px 30px rgba(0,0,0,.5);will-change:transform;}
  .grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
    background:radial-gradient(circle at 30% 20%,#fff 0,transparent 42%),radial-gradient(circle at 70% 75%,#fff 0,transparent 44%);}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
    background:linear-gradient(to bottom,rgba(10,6,8,0) 0%,rgba(10,6,8,.45) 55%,rgba(8,4,6,.92) 100%);}
  .scrimTop{position:absolute;left:0;right:0;top:0;height:26%;pointer-events:none;
    background:linear-gradient(to top,rgba(8,4,6,0) 0%,rgba(8,4,6,.7) 100%);}

  /* Rótulo inferior */
  .rot{position:absolute;left:70px;right:70px;bottom:150px;text-align:center;}
  .rot .kick{font-weight:800;font-size:26px;letter-spacing:5px;text-transform:uppercase;color:var(--coral);}
  .rot .bar{width:60px;height:5px;border-radius:3px;background:var(--coral);margin:14px auto 0;}
  .rot .line{margin-top:18px;font-weight:800;font-size:56px;line-height:1.08;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6);}
  .rot .sub{margin-top:16px;font-family:"CrimsonText",Georgia,serif;font-style:italic;font-size:34px;color:rgba(255,255,255,.9);}

  /* Ficha de obra */
  .obra{position:absolute;left:70px;right:70px;bottom:150px;text-align:center;}
  .obra .t{font-weight:900;font-size:52px;line-height:1.05;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6);}
  .obra .m{margin-top:12px;font-weight:600;font-size:30px;color:rgba(255,255,255,.82);letter-spacing:1px;}
  .obra .m b{color:var(--coral);font-weight:800;}

  /* Marca superior */
  .brand{position:absolute;left:0;right:0;top:70px;text-align:center;}
  .brand .m{font-weight:900;font-size:40px;letter-spacing:-1px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6);}
  .brand .m b{color:var(--coral);}

  /* Tarjetas velvet (gancho / cierre / titular) */
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 100px;
    background:radial-gradient(120% 90% at 50% 32%,var(--teatro-light) 0%,var(--teatro) 46%,var(--teatro-dark) 100%);opacity:0;}
  .card .mk{font-weight:900;font-size:150px;line-height:.82;color:#fff;letter-spacing:-6px;}
  .card .mk b{color:var(--coral);}
  .card .kick{margin-top:34px;font-weight:800;font-size:27px;letter-spacing:6px;text-transform:uppercase;color:var(--coral);}
  .card .big{margin-top:20px;font-weight:900;font-size:78px;line-height:1.05;color:#fff;}
  .card .lead{font-family:"CrimsonText",Georgia,serif;font-style:italic;font-size:52px;line-height:1.3;color:#fff;}
  .card .lead b{font-style:normal;font-weight:700;color:var(--coral);}
  .card .sub{margin-top:26px;font-family:"CrimsonText",Georgia,serif;font-style:italic;font-size:38px;color:rgba(255,255,255,.88);}
  .card .url{margin-top:26px;font-weight:800;font-size:44px;color:var(--coral);}
  #vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,.4);}
</style>

<div id="stage"><div id="scenes"></div><div class="grain"></div><div id="vig"></div></div>

<script>
window.__ASSETS__ = window.__ASSETS__ || null; /* __ASSETS_INJECT__ */
window.__SCENES__ = window.__SCENES__ || null; /* __SCENES_INJECT__ */
window.__META__ = window.__META__ || null;     /* __META_INJECT__ */
(function(){
  const A=window.__ASSETS__, S=window.__SCENES__||[], M=window.__META__||{};
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeInOut=(t)=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const easeOut=(t)=>1-Math.pow(1-t,3);
  const seg=(t,a,b,fi,fo)=>clamp(Math.min((t-a)/fi,(b-t)/fo),0,1);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const FADE=M.fadeMs??420;
  const brandTxt=M.brand||"[<b>o</b>lvidos";

  const root=document.getElementById("scenes");
  let acc=0; const scenes=S.map((sc)=>{const o={...sc,t0:acc,t1:acc+sc.dur};acc+=sc.dur;return o;});
  window.__DURATION_MS__=acc;

  // construir DOM por escena
  scenes.forEach((sc,i)=>{
    const el=document.createElement("div"); el.className="scene"; el.id="sc"+i;
    if(sc.kind==="card"){
      el.innerHTML=`<div class="card" style="opacity:1">
        ${sc.mk?`<div class="mk">[<b>o</b></div>`:``}
        ${sc.kicker?`<div class="kick">${esc(sc.kicker)}</div>`:``}
        ${sc.lead?`<div class="lead">${sc.lead}</div>`:``}
        ${sc.big?`<div class="big">${esc(sc.big)}</div>`:``}
        ${sc.sub?`<div class="sub">${esc(sc.sub)}</div>`:``}
        ${sc.url?`<div class="url">${esc(sc.url)}</div>`:``}</div>`;
    } else {
      const a=A[sc.img]||{src:"",w:1,h:1};
      el.innerHTML=`<div class="bg" style="background-image:url('${a.src}')"></div>
        <div class="fg"><img src="${a.src}"/></div>
        <div class="scrimTop"></div><div class="scrim"></div>
        <div class="brand"><div class="m">${brandTxt}</div></div>
        ${sc.obra?`<div class="obra"><div class="t">${esc(sc.obra.titulo)}</div><div class="m">${sc.obra.meta||""}</div></div>`:``}
        ${(sc.kicker||sc.title||sc.sub)?`<div class="rot">${sc.kicker?`<div class="kick">${esc(sc.kicker)}</div><div class="bar"></div>`:``}${sc.title?`<div class="line">${esc(sc.title)}</div>`:``}${sc.sub?`<div class="sub">${esc(sc.sub)}</div>`:``}</div>`:``}`;
    }
    root.appendChild(el);
  });

  window.renderAt=function(t){
    for(let i=0;i<scenes.length;i++){
      const sc=scenes[i]; const el=document.getElementById("sc"+i);
      const lt=t-sc.t0;
      let op = seg(t, sc.t0, sc.t1, (i===0?260:FADE), (i===scenes.length-1?300:FADE));
      // primeras/últimas
      if(i===0) op=Math.min(op, clamp(t/260,0,1));
      el.style.opacity=op.toFixed(3);
      el.style.zIndex = (t>=sc.t0 && t<sc.t1)?"2":"1";
      if(op<=0.001){ continue; }
      if(sc.kind!=="card"){
        const img=el.querySelector(".fg img");
        const p=easeInOut(clamp(lt/sc.dur,0,1));
        const z=sc.zoom||[1.0,1.07];
        const sc0=lerp(z[0],z[1],p);
        const pan=sc.pan||[0,0];
        const dx=lerp(-pan[0],pan[0],p), dy=lerp(-pan[1],pan[1],p);
        if(img) img.style.transform=`scale(${sc0.toFixed(4)}) translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
        const bg=el.querySelector(".bg");
        if(bg) bg.style.transform=`scale(${(1.1*lerp(1.0,1.04,p)).toFixed(4)})`;
        // aparición de rótulo/ficha
        const cap=el.querySelector(".rot")||el.querySelector(".obra");
        if(cap){ const co=Math.min(clamp((lt-260)/420,0,1), clamp((sc.dur-lt)/380,0,1)); cap.style.opacity=co.toFixed(3);
          cap.style.transform=`translateY(${lerp(14,0,easeOut(clamp((lt-260)/500,0,1))).toFixed(1)}px)`; }
      }
    }
  };
  window.__READY__=true;
})();
</script>
